version: "3.8"

services:

  backend:
    build:
      context: ./
      dockerfile: ./backend/Dockerfile
    image: dicodebreaker-backend:local
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/dicodebreaker_db
    depends_on:
      - frontend
      - db

  frontend:
    build:
      context: ./
      dockerfile: ./frontend/Dockerfile
    image: dicodebreaker-frontend:local
    ports:
    - "80:80"
    volumes:
    - ./nginx/config/:/etc/nginx/conf.d/
  
  adminer:
    image: adminer
    container_name: my-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

  
  db:
    image: postgres:alpine
    container_name: postgres-db
    environment: 
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dicodebreaker_db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    
volumes:
  db_data:
    driver: local
